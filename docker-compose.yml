services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: ./worker
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - DOWNLOAD_DIR=/app/downloads

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_URL=http://worker:8000
      - NEXTAUTH_SECRET=change-me-in-production
      - NEXTAUTH_URL=http://localhost:3000

volumes:
  redis_data:
